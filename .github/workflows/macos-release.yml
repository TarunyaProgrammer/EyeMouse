name: EyeMouse macOS Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    env:
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EYEMOUSE_ENABLE_UPDATES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
        run: |
          certificate_path="$RUNNER_TEMP/eyemouse-signing.p12"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          echo "CSC_LINK=$certificate_path" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:native
      - run: pnpm build
      - run: pnpm --filter @eyemouse/desktop exec electron-builder --mac --arm64 --publish always
      - name: Verify packaged contents
        run: scripts/verify-macos-package.sh apps/desktop/dist/mac-arm64/EyeMouse.app
      - name: Verify signed bundle
        run: scripts/verify-macos-app.sh apps/desktop/dist/mac-arm64/EyeMouse.app
